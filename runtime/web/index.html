<!doctype html>
<!-- SPDX-License-Identifier: BSD-1-Clause -->
<!--
  The page a game exported for the web is shown in. The export fills in
  each name between double braces: title, the game's name; head, the icon's
  link and what the export preset adds to the head; background, the colour
  behind the game and of the loading screen; canvas, `fill` - the whole
  page - or `project` - the project's size, which width and height are;
  icon, the loading screen's picture or nothing; game, what fluxion.js runs,
  as JSON.

  A page of a game's own may say these too, and needs the canvas, the JSON
  script and fluxion.js as they are here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: {{background}};
  }
  #fluxion-canvas {
    display: block;
    outline: none;
    touch-action: none;
  }
  body.fill #fluxion-canvas {
    width: 100%;
    height: 100%;
  }
  body.project {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.project #fluxion-canvas {
    width: min({{width}}px, 100vw);
    height: min({{height}}px, 100vh);
  }
  #fluxion-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: {{background}};
    color: #e8e8ea;
    font: 15px system-ui, sans-serif;
    text-align: center;
    padding: 16px;
    box-sizing: border-box;
  }
  #fluxion-overlay[hidden] {
    display: none;
  }
  #fluxion-overlay img {
    width: 96px;
    height: 96px;
    object-fit: contain;
  }
  #fluxion-bar {
    width: min(320px, 60vw);
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.15);
    overflow: hidden;
  }
  #fluxion-done {
    width: 0;
    height: 100%;
    background: #e8e8ea;
  }
</style>
{{head}}
</head>
<body class="{{canvas}}">
<canvas id="fluxion-canvas" tabindex="0"></canvas>
<div id="fluxion-overlay">
  {{icon}}
  <div id="fluxion-bar"><div id="fluxion-done"></div></div>
  <div id="fluxion-say">Loading...</div>
</div>
<script type="application/json" id="fluxion-game">{{game}}</script>
<script type="module" src="fluxion.js"></script>
</body>
</html>
